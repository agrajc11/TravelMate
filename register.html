<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | TravelMate</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <div class="brand">TravelMate<span>.</span></div>
                <h1>Create Account</h1>
                <p>Start planning your next journey.</p>
            </div>

            <form id="registerForm" novalidate>
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="Enter your full name" required>

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a password" required>

                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Re-enter your password" required>

                <button type="submit" class="primary-btn">Register</button>
            </form>

            <p class="auth-switch">
                Already have an account? <a href="login.html">Login</a>
            </p>

            <p class="demo-note">
                This is a frontend-only demo project. Local Storage is used for learning and testing only, not for secure production authentication.
            </p>
        </div>
    </div>

    <dialog id="customAlertModal" class="custom-alert-modal">
        <div class="custom-alert-content">
            <p id="customAlertText">Message</p>
            <button type="button" class="primary-btn" data-close-alert>OK</button>
        </div>
    </dialog>

    <script src="js/auth.js"></script>
</body>
</html>
